name: CI

# Quality checks on pull requests only — push to main does not run workflows.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install workspace tooling
        run: dart pub get

      - name: Bootstrap Melos packages
        run: dart run melos bootstrap

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
