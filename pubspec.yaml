name: zephyr_workspace
description: Melos workspace for Zephyr and shared packages.
publish_to: 'none'

environment:
  sdk: ^3.13.4

workspace:
  - apps/zephyr
  - packages/plain_text_editor
  - packages/text_editor_foundation
  - packages/flutter_primitives

dev_dependencies:
  melos: ^7.0.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      run: dart run melos exec --scope=zephyr -- flutter analyze lib tests && dart run melos exec --ignore=zephyr -- flutter analyze lib
      description: Static analysis for the app and local packages.

    test:
      run: dart run melos exec --scope=zephyr -- flutter test tests
      description: Run Zephyr widget and unit tests.

    format:
      run: dart run melos exec --dir-exists=lib -- dart format lib
      description: Format Dart sources in the app and packages.

    run:
      run: dart run melos exec --scope=zephyr -- flutter run
      description: Run Zephyr from repo root (e.g. dart run melos run run -- -d windows).
